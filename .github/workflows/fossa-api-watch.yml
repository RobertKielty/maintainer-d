name: FOSSA API Watch

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily — off-peak for both US and EU hours
  workflow_dispatch:

concurrency:
  group: fossa-api-watch

permissions:
  contents: read
  issues: write

jobs:
  fossa-api-watch:
    name: Check FOSSA API surface for drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diff watch-listed FOSSA endpoints against the live spec
        id: watch
        run: |
          set -euo pipefail
          python3 scripts/fossa-api-watch.py \
            --baseline plugins/fossa/swagger.json \
            --watchlist plugins/fossa/fossa-api-watchlist.json \
            --report-file "${RUNNER_TEMP}/fossa-api-watch-report.md" \
            --github-output "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/fossa-api-watch-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check whether issue notifications are available
        id: issues
        if: steps.watch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          enabled=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"
          if [[ "${enabled}" == "false" ]]; then
            echo "::notice::Issues are disabled; FOSSA API drift findings are available in the job summary."
          fi

      - name: Ensure the fossa-api-watch label exists
        if: steps.watch.outputs.has_changes == 'true' && steps.issues.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create fossa-api-watch \
            --color ededed \
            --description "FOSSA API drift detected by the daily watch" \
            --force

      - name: Open or update an issue with the findings
        if: steps.watch.outputs.has_changes == 'true' && steps.issues.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_file="${RUNNER_TEMP}/fossa-api-watch-report.md"
          existing_issue=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label fossa-api-watch \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "${existing_issue}" ]]; then
            gh issue comment "${existing_issue}" --repo "${GITHUB_REPOSITORY}" --body-file "${report_file}"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "FOSSA API drift detected" \
              --label fossa-api-watch \
              --body-file "${report_file}"
          fi
