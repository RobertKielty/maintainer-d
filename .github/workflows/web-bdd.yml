name: Web BDD tests

# Skipped when a change touches only docs or deploy manifests. Go changes
# still run it because the suite exercises web-bff.
on:
  push:
    paths-ignore: &skip
      - "**/*.md"
      - "**/*.MD"
      - "deploy/**"
      - "docs/**"
      - "specifications/**"
  pull_request:
    paths-ignore: *skip

jobs:
  web-bdd:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.57 cannot
    # install browser dependencies for. Revisit when Playwright is upgraded
    # to a release that supports ubuntu26.04 (1.64+).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maintainerd_test
          POSTGRES_USER: maintainerd
          POSTGRES_PASSWORD: maintainerd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintainerd -d maintainerd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Key the browser cache on the Playwright version, not the whole
      # lockfile: unrelated dependency bumps should not evict the browsers.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' web/package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # clo-ui is a git dependency whose prepare script runs `yarn build`.
      # GitHub's runner images stopped shipping yarn (ubuntu-24.04 had
      # 1.22.22 as of 2026-09), so install the same version explicitly.
      - name: Install yarn for git dependency builds
        run: npm install -g yarn@1.22.22

      - name: Install web deps
        run: |
          cd web
          npm ci

      # The BDD suite only launches chromium (web/tests/steps/hooks.js), so
      # firefox/webkit/ffmpeg are never needed. On a cache hit the download
      # is skipped entirely; only the OS packages (which the cache cannot
      # hold) are installed.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd web
          npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          cd web
          npx playwright install-deps chromium

      - name: Run web BDD tests
        env:
          CONTAINER_TOOL: docker
          FOSSA_API_TOKEN: dummy-token
          MD_DB_DRIVER: postgres
          MD_DB_DSN: host=localhost port=5432 user=maintainerd password=maintainerd dbname=maintainerd_test sslmode=disable
          WEB_BDD_USE_MICROCKS: "true"
        run: make web-bdd

      - name: Dump web-bdd logs
        if: failure()
        run: |
          echo "--- web-bff-test.log ---"
          cat testdata/web-bff-test.log || true
          echo "--- web-app-test.log ---"
          cat testdata/web-app-test.log || true
          echo "--- web-build-test.log ---"
          cat testdata/web-build-test.log || true

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bdd-junit
          path: testdata/web-bdd-results.xml

      - name: Upload BDD artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bdd-artifacts
          path: |
            testdata/web-bdd-report.json
            testdata/web-bdd-report
            testdata/web-artifacts
