apiVersion: batch/v1
kind: CronJob
metadata:
  name: maintainer-sanitize
  namespace: maintainerd
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  # Suspended 2026-09-04: sanitize reconciles against legacy maintainer ref
  # files, which fight dot-project-sync on projects that have adopted
  # .project. Keep suspended until the legacy-ref retirement lands.
  suspend: true
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: maintainer-sync
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: maintainerd
                namespaces:
                - maintainerd
                topologyKey: kubernetes.io/hostname
          imagePullSecrets:
          - name: ghcr-secret
          containers:
          - name: sanitize
            image: ghcr.io/robertkielty/maintainerd-sanitize:latest
            imagePullPolicy: Always
            envFrom:
            - secretRef:
                name: maintainerd-db-env
            # The provenance resolver (blame/PR/review lookups behind
            # legacy-ref observations) is optional in code but dead without a
            # GitHub credential; source it from the shared server secret.
            env:
            - name: GITHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintainerd-server-env
                  key: GITHUB_API_TOKEN
            resources: {}
            terminationMessagePolicy: File
