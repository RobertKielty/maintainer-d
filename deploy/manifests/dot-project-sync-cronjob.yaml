apiVersion: batch/v1
kind: CronJob
metadata:
  name: dot-project-sync
  namespace: maintainerd
spec:
  schedule: "0 * * * *"
  # The job authenticates to LFX with the M2M client in maintainerd-server-env
  # (LFX_CLIENT_ID/LFX_CLIENT_SECRET) and mints its own short-lived token each
  # run. Still suspended until a one-off run from this CronJob has verified the
  # M2M credential in-cluster; un-suspend in a separate PR after that.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata: {}
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        metadata: {}
        spec:
          containers:
          # tag pinned by kustomization.yaml (images:); apply with -k, not -f
          - image: ghcr.io/cncf/maintainerd-dot-project-sync:latest
            imagePullPolicy: Always
            name: dot-project-sync
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            env:
            - name: DOT_PROJECT_SYNC_TIMEOUT
              value: "50m"
            envFrom:
            - secretRef:
                name: maintainerd-db-env
            - secretRef:
                name: maintainerd-server-env
          dnsPolicy: ClusterFirst
          imagePullSecrets:
          - name: ghcr-secret
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
